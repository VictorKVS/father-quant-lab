[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "father-quant-lab"
version = "0.1.0"
description = "Evidence-based backtesting and paper-trading research lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
